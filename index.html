
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE DESIGNER BD</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
scroll-behavior:smooth;
}

body{
background:#0b0014;
color:white;
overflow-x:hidden;
}

/* ANIMATED BACKGROUND */

body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:
radial-gradient(circle,#a020f033 10%,transparent 10%),
radial-gradient(circle,#c56cff22 10%,transparent 10%);
background-size:120px 120px;
animation:bgmove 20s linear infinite;
z-index:-1;
}

@keyframes bgmove{
0%{transform:translate(0,0);}
100%{transform:translate(-120px,-120px);}
}

/* HEADER */

header{
text-align:center;
padding:80px 20px;
background:linear-gradient(135deg,#14001f,#25003a,#3d0052);
border-bottom:2px solid #a020f0;
animation:fadeIn 2s;
}

.banner{
width:100%;
max-width:900px;
border-radius:25px;
box-shadow:0 0 35px rgba(160,32,240,0.6);
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

header h1{
font-size:65px;
margin-top:25px;
color:#d580ff;
text-shadow:0 0 25px #a020f0;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px #a020f0;}
to{text-shadow:0 0 35px #d580ff;}
}

header p{
font-size:22px;
margin-top:10px;
color:#ddd;
}

.btn{
display:inline-block;
margin-top:30px;
padding:16px 40px;
background:#a020f0;
color:white;
text-decoration:none;
border-radius:50px;
font-size:18px;
font-weight:bold;
transition:0.4s;
animation:btnGlow 2s infinite alternate;
}

@keyframes btnGlow{
from{box-shadow:0 0 10px #a020f0;}
to{box-shadow:0 0 30px #d580ff;}
}

.btn:hover{
transform:scale(1.08);
background:#c56cff;
}

/* SECTION TITLE */

.section-title{
text-align:center;
font-size:45px;
margin:70px 0 35px;
color:#d580ff;
text-shadow:0 0 20px #a020f0;
}

/* SERVICES */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:0 30px;
}

.card{
background:#161616;
padding:25px;
border-radius:25px;
text-align:center;
border:1px solid #333;
transition:0.4s;
position:relative;
overflow:hidden;
animation:fadeInUp 1s;
}

.card::before{
content:"";
position:absolute;
top:-100%;
left:-100%;
width:200%;
height:200%;
background:linear-gradient(45deg,transparent,#a020f055,transparent);
transform:rotate(25deg);
transition:0.5s;
}

.card:hover::before{
top:100%;
left:100%;
}

.card:hover{
transform:translateY(-12px) scale(1.03);
border-color:#a020f0;
box-shadow:0 0 30px rgba(160,32,240,0.5);
}

.card img{
width:100%;
border-radius:18px;
margin-bottom:15px;
}

.card h3{
color:#d580ff;
font-size:24px;
}

.price{
margin-top:10px;
color:#ccc;
font-size:18px;
}

.select-btn{
display:inline-block;
margin-top:15px;
padding:12px 25px;
background:#a020f0;
color:white;
text-decoration:none;
border-radius:30px;
transition:0.3s;
}

.select-btn:hover{
background:#c56cff;
}

/* ORDER FORM */

.order{
padding:60px 20px;
}

form{
max-width:650px;
margin:auto;
background:#161616;
padding:35px;
border-radius:25px;
border:1px solid #333;
box-shadow:0 0 25px rgba(160,32,240,0.3);
animation:fadeIn 1.5s;
}

input,textarea,select{
width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:14px;
background:#0d0d0d;
color:white;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:16px;
margin-top:20px;
border:none;
background:#a020f0;
color:white;
font-size:18px;
border-radius:40px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#c56cff;
transform:scale(1.03);
}

/* ORDER DISPLAY */

#orders{
max-width:750px;
margin:40px auto;
padding:0 20px;
}

.order-box{
background:#161616;
padding:25px;
margin-top:20px;
border-radius:20px;
border:1px solid #333;
animation:fadeInUp 1s;
}

.order-box h3{
color:#d580ff;
margin-bottom:10px;
}

/* FOOTER */

footer{
text-align:center;
padding:35px;
margin-top:60px;
background:#111;
border-top:2px solid #a020f0;
}

footer h3{
color:#d580ff;
margin-bottom:10px;
}

/* ANIMATIONS */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes fadeInUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<header>

<img src="AC048F5E-1C15-45FD-9D50-D89A3386D7AB.png" class="banner">

<h1>THE DESIGNER BD</h1>

<p>Professional Graphic Design Services</p>

<a href="#order" class="btn">ORDER NOW</a>

</header>

<h2 class="section-title">Our Services</h2>

<section class="grid">

<div class="card">
<img src="AC048F5E-1C15-45FD-9D50-D89A3386D7AB.png">
<h3>Logo Design</h3>
<p class="price">500৳</p>
<a href="#order" class="select-btn">Select</a>
</div>

<div class="card">
<img src="AC048F5E-1C15-45FD-9D50-D89A3386D7AB.png">
<h3>Banner Design</h3>
<p class="price">400৳</p>
<a href="#order" class="select-btn">Select</a>
</div>

<div class="card">
<img src="AC048F5E-1C15-45FD-9D50-D89A3386D7AB.png">
<h3>Thumbnail Design</h3>
<p class="price">300৳</p>
<a href="#order" class="select-btn">Select</a>
</div>

<div class="card">
<img src="AC048F5E-1C15-45FD-9D50-D89A3386D7AB.png">
<h3>Poster Design</h3>
<p class="price">350৳</p>
<a href="#order" class="select-btn">Select</a>
</div>

</section>

<section class="order" id="order">

<h2 class="section-title">Place Your Order</h2>

<form id="orderForm">

<input type="text" id="name" placeholder="Your Name" required>

<select id="service">
<option>Logo Design</option>
<option>Banner Design</option>
<option>Thumbnail Design</option>
<option>Poster Design</option>
</select>

<textarea id="details" rows="5" placeholder="Describe your design"></textarea>

<button type="submit">Confirm Order</button>

</form>

</section>

<div id="orders"></div>

<footer>

<h3>THE DESIGNER BD</h3>

<p>Premium Animated Graphic Design Website</p>

</footer>

<script>

document.getElementById("orderForm").addEventListener("submit", function(e){

e.preventDefault();

let name=document.getElementById("name").value;
let service=document.getElementById("service").value;
let details=document.getElementById("details").value;

let box=document.createElement("div");

box.classList.add("order-box");

box.innerHTML=`
<h3>New Order Received</h3>
<p><b>Name:</b> ${name}</p>
<p><b>Service:</b> ${service}</p>
<p><b>Details:</b> ${details}</p>
`;

document.getElementById("orders").appendChild(box);

document.getElementById("orderForm").reset();

});

</script>

</body>
</html>
